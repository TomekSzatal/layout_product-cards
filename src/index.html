<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Product cards</title>

    <!-- Google font -->
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap"
      rel="stylesheet"
    />

    <!-- Twój CSS -->
    <link
      rel="stylesheet"
      href="./styles/index.css"
    />
  </head>

  <body>
    <main class="page">
      <h1 class="page__title">Product cards</h1>

      <div
        class="card"
        data-qa="card"
      >
        <div class="card__image">
          <img
            src="./images/imac.jpeg"
            alt="iMac"
          />
        </div>

        <h2 class="card__title">
          APPLE A1419 iMac 27" Retina 5K Monoblock (MNE92UA/A)
        </h2>

        <div class="card__code">Product code: 195434</div>

        <div class="card__review">
          <div class="stars stars--4">
            <div class="stars__star"></div>
            <div class="stars__star"></div>
            <div class="stars__star"></div>
            <div class="stars__star"></div>
            <div class="stars__star"></div>
          </div>
          <div class="card__reviews-count">Reviews: 5</div>
        </div>

        <div class="card__price-row">
          <span class="card__price-label">Price:</span>
          <span class="card__price-value">$2,199</span>
        </div>

        <a
          href="#"
          class="card__buy"
          data-qa="hover"
        >
          BUY
        </a>
      </div>
    </main>
  </body>
</html>
